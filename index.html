<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <title>Calculator</title>
</head>
<body>
    
    <div class="container">
        
        <div class="app">
            
            <input type="text" id="display">
            
            <div class="btns">
                <div class="clearing">
                    <button id="clear">C</button>
                    <button id="backspace">←</button>
                </div>
                
                <div class="numbers">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operand">÷</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operand">x</button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operand">+</button>
                    <button>0</button>
                    <button class="operand">.</button>
                    <button class="operand">=</button>
                    <button class="operand">-</button>
                </div>

            </div>
            
        </div>

    </div>

    <script src="script/main.js"></script>
</body>
</html>
